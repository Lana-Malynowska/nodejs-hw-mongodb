type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 6876d326523331823ad51394
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+380123456789'
  email:
    description: "Contact's email"
    type: string
    example: j.doe@mail.com
  isFavourite:
    description: 'Whether is contact favourite'
    type: boolean
    example: false
  contactType:
    description: 'Type of contact'
    type: string
    enum: ['work', 'home', 'personal']
  userId:
    description: 'User ID the contact belongs to'
    type: string
    example: 6876d326523331823ad51394
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/dcx2vdwpb/image/upload/v1752602032/samples/man-portrait.jpg

tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: 'Returns a paginated and filterable list of user contacts'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
    description: 'Page number for pagination'
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
    description: 'Number of contacts per page'
  - in: query
    name: sortBy
    schema:
      type: string
      example: 'name'
    description: 'Field to sort by'
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
      example: 'asc'
    description: 'Sort order'
  - in: query
    name: name
    schema:
      type: string
    description: 'Filter contacts by name'
  - in: query
    name: phoneNumber
    schema:
      type: string
    description: 'Filter contacts by phone number'
  - in: query
    name: email
    schema:
      type: string
    description: 'Filter contacts by email'
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: false
    description: 'Filter contacts by favourite status'
  - in: query
    name: contactType
    schema:
      type: string
      enum: ['work', 'home', 'personal']
      example: work
    description: 'Filter contacts by contact type'
responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: number
                  example: 1
                perPage:
                  type: number
                  example: 10
                totalItems:
                  type: number
                  example: 17
                totalPages:
                  type: number
                  example: 2
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: true
  '404':
    $ref: '../../components/responses/404.yaml'

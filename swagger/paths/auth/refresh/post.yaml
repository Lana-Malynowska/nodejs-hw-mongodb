tags:
  - Auth
summary: Refresh user session
operationId: refreshUserSession
description: 'Refresh user session and get new access token'
security:
  - bearerAuth: []
responses:
  '200':
    description: Successfully refreshed a session
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'dhxXL/R8A4897Vi9puLiUIFAI5ejt8gjU79K4tr2'

  '401':
    $ref: ../../../components/responses/401.yaml
